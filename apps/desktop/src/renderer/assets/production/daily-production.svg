<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Daily Production card artwork (27 Nov 2026): the factory at work. A press stamps slippers out onto a moving
       belt, a finished pair rides along it toward a 777 carton, and a gear turns above. A production line, not a
       sheet, so the card reads apart from Orders and Customer Balance at a glance (owner, 27 Nov 2026). Sky cards'
       palette; it carries its own soft ground, so the card draws no cloud (artworkHasScene). -->
  <defs>
    <linearGradient id="dp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fc4"/>
      <stop offset="1" stop-color="#1d3769"/>
    </linearGradient>
    <linearGradient id="dp-belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f63"/>
      <stop offset="1" stop-color="#16243f"/>
    </linearGradient>
    <linearGradient id="dp-box-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="dp-gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3f5"/>
      <stop offset="1" stop-color="#1e6fd0"/>
    </linearGradient>
    <filter id="dp-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="327" cy="330" rx="262" ry="22" fill="#dce9f8"/>

  <!-- The press: a tall machine on the left, its head over the belt -->
  <g filter="url(#dp-shadow)">
    <rect x="86" y="96" width="112" height="214" rx="14" fill="url(#dp-body)"/>
    <rect x="102" y="114" width="80" height="54" rx="8" fill="#eaf2fd"/>
    <rect x="112" y="126" width="38" height="7" rx="3.5" fill="#1d3769"/>
    <rect x="112" y="140" width="58" height="6" rx="3" fill="#a9bfdc"/>
    <rect x="112" y="152" width="44" height="6" rx="3" fill="#a9bfdc"/>
    <circle cx="116" cy="190" r="9" fill="#34c26b"/>
    <circle cx="142" cy="190" r="9" fill="#fbbf24"/>
    <circle cx="168" cy="190" r="9" fill="#e5484d"/>
    <rect x="186" y="118" width="96" height="30" rx="10" fill="#2f5aa8"/>
    <rect x="236" y="146" width="20" height="44" rx="5" fill="#1d3769"/>
    <rect x="222" y="188" width="48" height="14" rx="4" fill="#3b6fc4"/>
  </g>

  <!-- The belt, with its rollers -->
  <g filter="url(#dp-shadow)">
    <rect x="176" y="250" width="328" height="34" rx="17" fill="url(#dp-belt)"/>
    <circle cx="198" cy="267" r="10" fill="#4b5f84"/>
    <circle cx="262" cy="267" r="10" fill="#4b5f84"/>
    <circle cx="326" cy="267" r="10" fill="#4b5f84"/>
    <circle cx="390" cy="267" r="10" fill="#4b5f84"/>
    <circle cx="454" cy="267" r="10" fill="#4b5f84"/>
    <circle cx="482" cy="267" r="10" fill="#4b5f84"/>
  </g>
  <path d="M196 300 H 240 M276 300 H 330" stroke="#9fbbe2" stroke-width="4" stroke-linecap="round"/>

  <!-- A slipper being pressed, and a finished pair riding the belt -->
  <g>
    <rect x="214" y="226" width="64" height="20" rx="10" fill="#1f2d48"/>
    <path d="M226 228 Q 246 206 266 228" fill="none" stroke="#2f5aa8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="318" y="226" width="62" height="20" rx="10" fill="#1f2d48"/>
    <path d="M330 228 Q 349 207 368 228" fill="none" stroke="#2f5aa8" stroke-width="8" stroke-linecap="round"/>
    <rect x="352" y="214" width="62" height="20" rx="10" fill="#26385a"/>
    <path d="M364 216 Q 383 195 402 216" fill="none" stroke="#3b6fc4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The 777 carton the pairs go into -->
  <g filter="url(#dp-shadow)">
    <path d="M470 190 L528 176 L582 190 L524 205 Z" fill="url(#dp-box-top)"/>
    <path d="M470 190 L524 205 L524 300 L470 285 Z" fill="#f4f7fb"/>
    <path d="M524 205 L582 190 L582 285 L524 300 Z" fill="#e3eaf3"/>
    <path d="M497 183 L555 197" stroke="#cdd8e6" stroke-width="5"/>
    <text x="478" y="250" font-size="22" font-weight="900" font-style="italic" fill="#111827" transform="skewY(15) translate(0 -128)">777</text>
    <text x="481" y="262" font-size="9" font-weight="800" letter-spacing="1" fill="#1e88e5" transform="skewY(15) translate(0 -128)">SEVEN</text>
  </g>

  <!-- A gear turning above the line -->
  <g transform="translate(400 92)">
    <path d="M0 -40 L9 -38 L12 -28 L22 -24 L31 -30 L38 -23 L32 -14 L36 -4 L46 0 L46 10 L36 13 L32 23 L38 32 L31 39 L22 33 L12 37 L9 47 L0 47 L-3 37 L-13 33 L-22 39 L-29 32 L-23 23 L-27 13 L-37 10 L-37 0 L-27 -4 L-23 -14 L-29 -23 L-22 -30 L-13 -24 L-3 -28 Z" transform="translate(-4 -3)" fill="url(#dp-gear)"/>
    <circle cx="0" cy="0" r="14" fill="#eaf2fd"/>
  </g>
  <circle cx="468" cy="70" r="5" fill="#9fbbe2"/>
  <circle cx="352" cy="58" r="4" fill="#bcd0ec"/>
</svg>
