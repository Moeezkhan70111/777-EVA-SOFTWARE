<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Daily Production card artwork: a production sheet with the day's bars, two finished 777 cartons and a tick
       that says the day is in. Drawn in the sky cards' palette; it carries its own soft ground, so the card draws
       no cloud behind it (artworkHasScene). -->
  <defs>
    <linearGradient id="dp-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fc"/>
    </linearGradient>
    <linearGradient id="dp-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8bfd"/>
      <stop offset="1" stop-color="#0b5ed7"/>
    </linearGradient>
    <linearGradient id="dp-bar-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc7ff"/>
      <stop offset="1" stop-color="#5fa3fb"/>
    </linearGradient>
    <linearGradient id="dp-box-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="dp-tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34c26b"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>
    <filter id="dp-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="330" cy="330" rx="250" ry="22" fill="#dce9f8"/>

  <!-- The production sheet on its clipboard -->
  <g filter="url(#dp-shadow)">
    <rect x="150" y="46" width="230" height="276" rx="18" fill="#1d3769"/>
    <rect x="162" y="60" width="206" height="252" rx="10" fill="url(#dp-sheet)"/>
  </g>
  <rect x="222" y="34" width="86" height="30" rx="9" fill="#2f5aa8"/>
  <rect x="242" y="26" width="46" height="16" rx="8" fill="#2f5aa8"/>
  <circle cx="265" cy="34" r="4" fill="#dce9f8"/>

  <!-- Heading lines -->
  <rect x="182" y="84" width="110" height="10" rx="5" fill="#1d3769"/>
  <rect x="182" y="102" width="70" height="7" rx="3.5" fill="#a9bfdc"/>

  <!-- The day's bars, one per machine -->
  <line x1="182" y1="276" x2="348" y2="276" stroke="#c7d6ea" stroke-width="2"/>
  <rect x="190" y="196" width="26" height="80" rx="6" fill="url(#dp-bar-soft)"/>
  <rect x="228" y="150" width="26" height="126" rx="6" fill="url(#dp-bar)"/>
  <rect x="266" y="178" width="26" height="98" rx="6" fill="url(#dp-bar-soft)"/>
  <rect x="304" y="132" width="26" height="144" rx="6" fill="url(#dp-bar)"/>
  <rect x="182" y="290" width="40" height="7" rx="3.5" fill="#a9bfdc"/>
  <rect x="290" y="290" width="58" height="7" rx="3.5" fill="#a9bfdc"/>

  <!-- Two finished cartons -->
  <g filter="url(#dp-shadow)">
    <path d="M392 222 L470 206 L540 222 L462 240 Z" fill="url(#dp-box-top)"/>
    <path d="M392 222 L462 240 L462 320 L392 302 Z" fill="#f4f7fb"/>
    <path d="M462 240 L540 222 L540 302 L462 320 Z" fill="#e3eaf3"/>
    <path d="M427 214 L505 230" stroke="#cdd8e6" stroke-width="5"/>
    <text x="407" y="286" font-size="28" font-weight="900" font-style="italic" fill="#111827" transform="skewY(14) translate(0 -104)">777</text>
    <text x="410" y="300" font-size="11" font-weight="800" letter-spacing="1" fill="#1e88e5" transform="skewY(14) translate(0 -104)">SEVEN</text>

    <path d="M436 160 L500 147 L558 160 L494 175 Z" fill="url(#dp-box-top)"/>
    <path d="M436 160 L494 175 L494 222 L436 207 Z" fill="#f4f7fb"/>
    <path d="M494 175 L558 160 L558 208 L494 222 Z" fill="#e3eaf3"/>
    <path d="M465 153 L529 167" stroke="#cdd8e6" stroke-width="4"/>
    <text x="448" y="221" font-size="20" font-weight="900" font-style="italic" fill="#111827" transform="skewY(14) translate(0 -114)">777</text>
  </g>

  <!-- The day is in -->
  <g filter="url(#dp-shadow)">
    <circle cx="540" cy="96" r="34" fill="url(#dp-tick)"/>
    <path d="M523 97 L535 109 L558 85" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparks -->
  <path d="M110 120 L126 98" stroke="#5fa3fb" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 150 L128 140" stroke="#5fa3fb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="598" cy="176" r="6" fill="#9cc7ff"/>
  <circle cx="104" cy="250" r="5" fill="#9cc7ff"/>
</svg>
