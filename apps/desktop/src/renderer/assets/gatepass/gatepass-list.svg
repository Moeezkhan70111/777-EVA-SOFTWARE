<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 80 530 300" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Gatepass List card artwork: the list panel in front of the warehouse, the truck and the
       gate barrier. The card draws the green cloud and sparks behind it (FeatureCard.tsx). -->

  <!-- Ground -->
  <ellipse cx="335" cy="352" rx="255" ry="24" fill="#e6f2e8"/>

  <g transform="translate(-22 0)">
  <!-- Warehouse -->
  <rect x="345" y="150" width="200" height="180" fill="#f3f5f4"/>
  <rect x="537" y="150" width="8" height="180" fill="#e3e7e5"/>
  <path d="M330 162 L445 96 L560 162 L560 176 L445 111 L330 176 Z" fill="#2f9a44"/>
  <path d="M330 176 L445 111 L560 176 L560 180 L445 115 L330 180 Z" fill="#23803a"/>
  <rect x="438" y="160" width="18" height="8" rx="2" fill="#4a5653"/>
  <rect x="378" y="184" width="138" height="14" rx="2" fill="#4a5653"/>
  <rect x="385" y="198" width="124" height="132" fill="#2e3a37"/>

  <!-- Forklift and cartons in the doorway -->
  <rect x="392" y="266" width="30" height="22" rx="2" fill="#d6a464"/>
  <rect x="392" y="288" width="30" height="22" rx="2" fill="#c8924f"/>
  <rect x="396" y="244" width="22" height="22" rx="2" fill="#dcae72"/>
  <path d="M407 244 V266 M407 266 V310" stroke="#b07b3c" stroke-width="2"/>
  <rect x="426" y="240" width="4" height="74" fill="#59645f"/>
  <rect x="433" y="240" width="4" height="74" fill="#59645f"/>
  <path d="M422 312 H446" stroke="#59645f" stroke-width="4" stroke-linecap="round"/>
