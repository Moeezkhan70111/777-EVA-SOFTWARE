    <path d="M136 86 h10 M136 91 h14 M136 96 h9" stroke="#23803a" stroke-width="2.4" stroke-linecap="round"/>
    <text x="168" y="98" font-size="15" font-weight="700" fill="#ffffff">Gatepass List</text>
    <rect x="296" y="81" width="102" height="22" rx="11" fill="#bfe3c4"/>
    <circle cx="309" cy="91" r="5" fill="none" stroke="#23803a" stroke-width="2"/>
    <path d="M313 95 l4 4" stroke="#23803a" stroke-width="2" stroke-linecap="round"/>

    <!-- Column heads -->
    <rect x="135" y="121" width="254" height="25" rx="7" fill="#e6f3e8"/>
    <g font-size="10" font-weight="700" fill="#23803a">
      <text x="144" y="138">ID</text>
      <text x="178" y="138">Vehicle</text>
      <text x="254" y="138">Purpose</text>
      <text x="338" y="138">Status</text>
    </g>

