  <!-- The Gatepass List panel, tilted slightly toward the viewer -->
  <g transform="translate(18 40) scale(0.85) rotate(-4 265 205)">
    <rect x="124" y="78" width="292" height="272" rx="20" fill="#0f3b24" opacity="0.07"/>
    <rect x="116" y="68" width="292" height="272" rx="20" fill="#2f9a44"/>
    <rect x="125" y="112" width="274" height="219" rx="13" fill="#ffffff"/>

