  <path d="M444 280 L448 256 H466 L470 280" fill="none" stroke="#23803a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="455" cy="270" r="5" fill="#2b3134"/>
  <circle cx="446" cy="313" r="8" fill="#2b3134"/>
  <circle cx="466" cy="313" r="8" fill="#2b3134"/>

  <!-- Truck, pulling out of the warehouse to the right -->
  <rect x="470" y="238" width="80" height="72" rx="5" fill="#2f9a44"/>
  <rect x="470" y="300" width="80" height="10" rx="3" fill="#23803a"/>
  <path d="M550 252 H572 Q580 252 583 260 L592 282 V306 Q592 312 586 312 H550 Z" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
