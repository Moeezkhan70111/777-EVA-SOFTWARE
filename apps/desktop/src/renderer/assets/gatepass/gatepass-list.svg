  <path d="M555 258 H570 Q575 258 577 263 L584 279 H555 Z" fill="#2b3a40"/>
  <rect x="550" y="292" width="42" height="5" fill="#dfe4e2"/>
  <rect x="585" y="298" width="8" height="8" rx="2" fill="#f4c542"/>
  <circle cx="490" cy="314" r="12" fill="#2b3134"/><circle cx="490" cy="314" r="5.5" fill="#9aa3a0"/>
  <circle cx="530" cy="314" r="12" fill="#2b3134"/><circle cx="530" cy="314" r="5.5" fill="#9aa3a0"/>
  <circle cx="574" cy="314" r="12" fill="#2b3134"/><circle cx="574" cy="314" r="5.5" fill="#9aa3a0"/>

  <!-- Gate barrier -->
  <rect x="330" y="326" width="236" height="11" rx="3" fill="#ffffff" stroke="#d9dfdc" stroke-width="1"/>
  <path d="M338 326 h14 l-6 11 h-14 Z M366 326 h14 l-6 11 h-14 Z M394 326 h14 l-6 11 h-14 Z M422 326 h14 l-6 11 h-14 Z M450 326 h14 l-6 11 h-14 Z M478 326 h14 l-6 11 h-14 Z M506 326 h14 l-6 11 h-14 Z M534 326 h14 l-6 11 h-14 Z" fill="#2f9a44"/>
  <rect x="562" y="300" width="28" height="60" rx="3" fill="#2f9a44"/>
  <rect x="559" y="294" width="34" height="10" rx="3" fill="#23803a"/>
  <rect x="570" y="310" width="10" height="10" rx="2" fill="#e4f2e5"/>

