    <g id="rows">
      <path d="M137 186 H387 M137 220 H387 M137 254 H387 M137 288 H387" stroke="#edf1ee" stroke-width="1.2"/>

      <rect x="143" y="160" width="15" height="15" rx="3.5" fill="#2f9a44"/>
      <path d="M146.5 167.5 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="175" y="164" width="62" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="252" y="164" width="64" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="334" y="158" width="36" height="18" rx="9" fill="#dff0e1"/>
      <text x="352" y="171" font-size="9.5" font-weight="700" fill="#23803a" text-anchor="middle">IN</text>
      <g fill="#4a5653"><circle cx="381" cy="161" r="1.6"/><circle cx="381" cy="167" r="1.6"/><circle cx="381" cy="173" r="1.6"/></g>

      <rect x="143" y="194" width="15" height="15" rx="3.5" fill="#2f9a44"/>
      <path d="M146.5 201.5 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="175" y="198" width="56" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="252" y="198" width="58" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="334" y="192" width="36" height="18" rx="9" fill="#dff0e1"/>
      <text x="352" y="205" font-size="9.5" font-weight="700" fill="#23803a" text-anchor="middle">IN</text>
      <g fill="#4a5653"><circle cx="381" cy="195" r="1.6"/><circle cx="381" cy="201" r="1.6"/><circle cx="381" cy="207" r="1.6"/></g>

      <rect x="143" y="228" width="15" height="15" rx="3.5" fill="#2f9a44"/>
      <path d="M146.5 235.5 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="175" y="232" width="64" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="252" y="232" width="66" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="334" y="226" width="36" height="18" rx="9" fill="#dff0e1"/>
      <text x="352" y="239" font-size="9.5" font-weight="700" fill="#23803a" text-anchor="middle">IN</text>
      <g fill="#4a5653"><circle cx="381" cy="229" r="1.6"/><circle cx="381" cy="235" r="1.6"/><circle cx="381" cy="241" r="1.6"/></g>

      <rect x="143" y="262" width="15" height="15" rx="3.5" fill="#2f9a44"/>
      <path d="M146.5 269.5 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="175" y="266" width="58" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="252" y="266" width="60" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="331" y="260" width="42" height="18" rx="9" fill="#eceeed"/>
      <text x="352" y="273" font-size="9.5" font-weight="700" fill="#87918c" text-anchor="middle">OUT</text>
      <g fill="#4a5653"><circle cx="381" cy="263" r="1.6"/><circle cx="381" cy="269" r="1.6"/><circle cx="381" cy="275" r="1.6"/></g>

      <rect x="143.5" y="296.5" width="14" height="14" rx="3.5" fill="#ffffff" stroke="#c9d1cc" stroke-width="1.5"/>
      <rect x="175" y="300" width="60" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="252" y="300" width="62" height="7" rx="3.5" fill="#d6dcd9"/>
      <rect x="334" y="294" width="36" height="18" rx="9" fill="#dff0e1"/>
      <text x="352" y="307" font-size="9.5" font-weight="700" fill="#23803a" text-anchor="middle">IN</text>
      <g fill="#4a5653"><circle cx="381" cy="297" r="1.6"/><circle cx="381" cy="303" r="1.6"/><circle cx="381" cy="309" r="1.6"/></g>
    </g>
