<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Customer Balance card artwork (27 Nov 2026): what customers owe, as money. A navy wallet with rupee notes rising
       out of it, and a stack of coins beside. A wallet, not a clipboard, so the card reads apart from the other three at
       a glance (owner, 27 Nov 2026). Sky cards' palette; it carries its own soft ground (artworkHasScene). -->
  <defs>
    <linearGradient id="cb-wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5aa8"/>
      <stop offset="1" stop-color="#1d3769"/>
    </linearGradient>
    <linearGradient id="cb-note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f2e3"/>
      <stop offset="1" stop-color="#a7dfbf"/>
    </linearGradient>
    <linearGradient id="cb-note-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eefc"/>
      <stop offset="1" stop-color="#b9d2f3"/>
    </linearGradient>
    <linearGradient id="cb-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cb-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="327" cy="330" rx="262" ry="22" fill="#dce9f8"/>

  <!-- Two rupee notes rising out of the wallet -->
  <g filter="url(#cb-shadow)">
    <g transform="rotate(-10 250 130)">
      <rect x="150" y="76" width="210" height="104" rx="10" fill="url(#cb-note-2)"/>
      <circle cx="255" cy="128" r="26" fill="none" stroke="#7da4dc" stroke-width="4"/>
      <text x="241" y="137" font-size="22" font-weight="900" fill="#2f5aa8">Rs</text>
    </g>
    <g transform="rotate(6 320 130)">
      <rect x="228" y="84" width="210" height="104" rx="10" fill="url(#cb-note)"/>
      <circle cx="333" cy="136" r="26" fill="none" stroke="#5cbf85" stroke-width="4"/>
      <text x="319" y="145" font-size="22" font-weight="900" fill="#1f9d55">Rs</text>
    </g>
  </g>

  <!-- The wallet, holding them -->
  <g filter="url(#cb-shadow)">
    <rect x="130" y="160" width="320" height="150" rx="22" fill="url(#cb-wallet)"/>
    <path d="M130 196 H 450" stroke="#3b6fc4" stroke-width="3"/>
    <rect x="372" y="214" width="96" height="58" rx="14" fill="#2f5aa8"/>
    <circle cx="404" cy="243" r="11" fill="#eaf2fd"/>
    <circle cx="404" cy="243" r="5" fill="#1d3769"/>
  </g>

  <!-- A stack of coins beside it -->
  <g filter="url(#cb-shadow)">
    <ellipse cx="530" cy="300" rx="46" ry="13" fill="#e08a0b"/>
    <rect x="484" y="282" width="92" height="18" fill="url(#cb-coin)"/>
    <ellipse cx="530" cy="282" rx="46" ry="13" fill="#fbbf24"/>
    <rect x="484" y="262" width="92" height="20" fill="url(#cb-coin)"/>
    <ellipse cx="530" cy="262" rx="46" ry="13" fill="#fbbf24"/>
    <rect x="484" y="242" width="92" height="20" fill="url(#cb-coin)"/>
    <ellipse cx="530" cy="242" rx="46" ry="13" fill="#fcd34d"/>
    <text x="516" y="248" font-size="15" font-weight="900" fill="#b45309">Rs</text>
  </g>

  <circle cx="96" cy="96" r="5" fill="#9fbbe2"/>
  <circle cx="560" cy="120" r="4" fill="#bcd0ec"/>
</svg>
