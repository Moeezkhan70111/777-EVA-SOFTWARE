<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Enter Orders card artwork (27 Nov 2026): an order book lying open, its lines being written with a pen, and the
       pair of slippers being ordered beside it. A book and a pen, not a clipboard, so the card reads apart from the
       other three at a glance (owner, 27 Nov 2026). Sky cards' palette; it carries its own soft ground (artworkHasScene). -->
  <defs>
    <linearGradient id="eo-page-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f0fa"/>
    </linearGradient>
    <linearGradient id="eo-page-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f0fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="eo-pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3f5"/>
      <stop offset="1" stop-color="#1e6fd0"/>
    </linearGradient>
    <filter id="eo-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="327" cy="330" rx="262" ry="22" fill="#dce9f8"/>

  <!-- The open order book: navy cover, two pages, the spine between -->
  <g filter="url(#eo-shadow)">
    <path d="M96 118 L322 96 L322 316 L96 296 Z" fill="#1d3769"/>
    <path d="M322 96 L548 118 L548 296 L322 316 Z" fill="#1d3769"/>
    <path d="M110 120 L318 104 L318 304 L110 288 Z" fill="url(#eo-page-l)"/>
    <path d="M326 104 L534 120 L534 288 L326 304 Z" fill="url(#eo-page-r)"/>
    <path d="M322 100 L322 312" stroke="#c2d2e8" stroke-width="4"/>
  </g>

  <!-- Left page: the party at the top, the lines already written -->
  <path d="M130 136 L240 128" stroke="#1d3769" stroke-width="9" stroke-linecap="round"/>
  <path d="M130 156 L206 151" stroke="#a9bfdc" stroke-width="6" stroke-linecap="round"/>
  <g stroke-linecap="round" stroke-width="7">
    <path d="M130 190 L250 183" stroke="#c7d6ea"/><path d="M268 182 L296 180" stroke="#2f5aa8"/>
    <path d="M130 216 L236 210" stroke="#c7d6ea"/><path d="M268 208 L296 206" stroke="#2f5aa8"/>
    <path d="M130 242 L244 237" stroke="#c7d6ea"/><path d="M268 235 L296 233" stroke="#2f5aa8"/>
  </g>
  <!-- Right page: the line being written now -->
  <g stroke-linecap="round" stroke-width="7">
    <path d="M346 140 L470 148" stroke="#c7d6ea"/><path d="M488 149 L514 151" stroke="#2f5aa8"/>
    <path d="M346 168 L452 175" stroke="#c7d6ea"/><path d="M488 177 L514 179" stroke="#2f5aa8"/>
    <path d="M346 196 L420 201" stroke="#1d3769"/>
  </g>

  <!-- The pen, writing that line -->
  <g filter="url(#eo-shadow)" transform="rotate(-38 440 168)">
    <rect x="420" y="96" width="22" height="118" rx="8" fill="url(#eo-pen)"/>
    <rect x="420" y="96" width="22" height="20" rx="8" fill="#1d3769"/>
    <path d="M420 212 L431 238 L442 212 Z" fill="#eaf2fd"/>
    <path d="M427 228 L431 238 L435 228 Z" fill="#1d3769"/>
  </g>

  <!-- The pair of slippers being ordered -->
  <g filter="url(#eo-shadow)">
    <rect x="502" y="262" width="86" height="26" rx="13" fill="#1f2d48"/>
    <path d="M518 266 Q 545 236 572 266" fill="none" stroke="#2f5aa8" stroke-width="10" stroke-linecap="round"/>
    <rect x="536" y="246" width="86" height="26" rx="13" fill="#26385a"/>
    <path d="M552 250 Q 579 220 606 250" fill="none" stroke="#3b6fc4" stroke-width="10" stroke-linecap="round"/>
  </g>

  <circle cx="86" cy="86" r="5" fill="#9fbbe2"/>
  <circle cx="572" cy="96" r="4" fill="#bcd0ec"/>
</svg>
