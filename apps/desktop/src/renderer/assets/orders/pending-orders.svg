<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Pending Orders card artwork (27 Nov 2026): a delivery truck loaded with 777 cartons, waiting to go, and an
       hourglass for the dozens still owed. A truck, not a clipboard, so the card reads apart from the other three at a
       glance (owner, 27 Nov 2026). Sky cards' palette with the Pending Orders amber for what waits; it carries its own
       soft ground (artworkHasScene). -->
  <defs>
    <linearGradient id="po-cargo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="po-cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fc4"/>
      <stop offset="1" stop-color="#1d3769"/>
    </linearGradient>
    <linearGradient id="po-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="po-box-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <filter id="po-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="327" cy="330" rx="262" ry="22" fill="#dce9f8"/>

  <!-- The truck: a white cargo box with the 777 mark, a blue cab in front -->
  <g filter="url(#po-shadow)">
    <rect x="96" y="120" width="300" height="168" rx="14" fill="url(#po-cargo)"/>
    <rect x="96" y="120" width="300" height="168" rx="14" fill="none" stroke="#cfdbeb" stroke-width="3"/>
    <text x="150" y="214" font-size="64" font-weight="900" font-style="italic" fill="#111827">777</text>
    <text x="156" y="246" font-size="20" font-weight="800" letter-spacing="3" fill="#1e88e5">SEVEN</text>
    <path d="M396 164 H 470 Q 486 164 494 178 L 530 236 Q 536 246 536 258 V 288 H 396 Z" fill="url(#po-cab)"/>
    <path d="M414 180 H 466 Q 474 180 478 188 L 506 236 H 414 Z" fill="#cfe2fb"/>
    <rect x="404" y="252" width="22" height="8" rx="4" fill="#9fbbe2"/>
    <rect x="86" y="284" width="456" height="14" rx="7" fill="#1d3769"/>
  </g>
  <!-- Wheels -->
  <g>
    <circle cx="168" cy="300" r="28" fill="#1f2d48"/><circle cx="168" cy="300" r="11" fill="#c2d2e8"/>
    <circle cx="324" cy="300" r="28" fill="#1f2d48"/><circle cx="324" cy="300" r="11" fill="#c2d2e8"/>
    <circle cx="470" cy="300" r="28" fill="#1f2d48"/><circle cx="470" cy="300" r="11" fill="#c2d2e8"/>
  </g>

  <!-- A carton waiting at the back, still to be loaded -->
  <g filter="url(#po-shadow)">
    <path d="M30 236 L58 229 L84 236 L56 243 Z" fill="url(#po-box-top)"/>
    <path d="M30 236 L56 243 L56 298 L30 291 Z" fill="#f4f7fb"/>
    <path d="M56 243 L84 236 L84 291 L56 298 Z" fill="#e3eaf3"/>
  </g>

  <!-- The hourglass: what is still owed -->
  <g filter="url(#po-shadow)" transform="translate(560 96)">
    <rect x="-34" y="-46" width="68" height="10" rx="5" fill="#1d3769"/>
    <rect x="-34" y="46" width="68" height="10" rx="5" fill="#1d3769"/>
    <path d="M-26 -36 H 26 Q 26 -6 4 4 Q 26 14 26 46 H -26 Q -26 14 -4 4 Q -26 -6 -26 -36 Z" fill="#ffffff" stroke="#c2d2e8" stroke-width="3"/>
    <path d="M-16 -26 H 16 Q 14 -10 0 -2 Q -14 -10 -16 -26 Z" fill="url(#po-sand)"/>
    <path d="M0 6 L0 30" stroke="#f59e0b" stroke-width="3"/>
    <path d="M-18 42 Q 0 22 18 42 Z" fill="url(#po-sand)"/>
  </g>
  <circle cx="520" cy="44" r="4" fill="#bcd0ec"/>
</svg>
