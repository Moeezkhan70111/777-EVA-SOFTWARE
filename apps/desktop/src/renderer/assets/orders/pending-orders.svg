<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 364" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Pending Orders card artwork: a party's order sheet, some lines ticked off by gatepasses and some still waiting,
       two 777 cartons ready to go, and an hourglass for what is still owed. Drawn in the sky cards' palette, with the
       Pending Orders amber for what waits; it carries its own soft ground, so the card draws no cloud (artworkHasScene). -->
  <defs>
    <linearGradient id="po-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fc"/>
    </linearGradient>
    <linearGradient id="po-box-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="po-done" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34c26b"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>
    <linearGradient id="po-wait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e08a0b"/>
    </linearGradient>
    <linearGradient id="po-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="po-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d3769" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="330" cy="330" rx="250" ry="22" fill="#dce9f8"/>

  <!-- The order sheet on its clipboard -->
  <g filter="url(#po-shadow)">
    <rect x="150" y="46" width="230" height="276" rx="18" fill="#1d3769"/>
    <rect x="162" y="60" width="206" height="252" rx="10" fill="url(#po-sheet)"/>
  </g>
  <rect x="222" y="34" width="86" height="30" rx="9" fill="#2f5aa8"/>
  <rect x="242" y="26" width="46" height="16" rx="8" fill="#2f5aa8"/>
  <circle cx="265" cy="34" r="4" fill="#dce9f8"/>

  <!-- Heading: the party and its order number -->
  <rect x="182" y="84" width="118" height="10" rx="5" fill="#1d3769"/>
  <rect x="182" y="102" width="72" height="7" rx="3.5" fill="#a9bfdc"/>

  <!-- Order lines: dispatched ones ticked, pending ones waiting -->
  <g>
    <circle cx="192" cy="140" r="10" fill="url(#po-done)"/>
    <path d="M187 140 L191 144 L198 136" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="135" width="86" height="9" rx="4.5" fill="#c7d6ea"/>
    <rect x="316" y="133" width="34" height="13" rx="6.5" fill="#d9f2e3"/>

    <circle cx="192" cy="180" r="10" fill="url(#po-done)"/>
    <path d="M187 180 L191 184 L198 176" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="175" width="70" height="9" rx="4.5" fill="#c7d6ea"/>
    <rect x="316" y="173" width="34" height="13" rx="6.5" fill="#d9f2e3"/>

    <circle cx="192" cy="220" r="10" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <rect x="212" y="215" width="92" height="9" rx="4.5" fill="#1d3769"/>
    <rect x="316" y="211" width="34" height="17" rx="8.5" fill="url(#po-wait)"/>

    <circle cx="192" cy="260" r="10" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <rect x="212" y="255" width="78" height="9" rx="4.5" fill="#1d3769"/>
    <rect x="316" y="251" width="34" height="17" rx="8.5" fill="url(#po-wait)"/>
  </g>
  <rect x="182" y="290" width="40" height="7" rx="3.5" fill="#a9bfdc"/>
  <rect x="290" y="290" width="58" height="7" rx="3.5" fill="#a9bfdc"/>

  <!-- Two cartons, ready to go out on the next gatepass -->
  <g filter="url(#po-shadow)">
    <path d="M392 222 L470 206 L540 222 L462 240 Z" fill="url(#po-box-top)"/>
    <path d="M392 222 L462 240 L462 320 L392 302 Z" fill="#f4f7fb"/>
    <path d="M462 240 L540 222 L540 302 L462 320 Z" fill="#e3eaf3"/>
    <path d="M427 214 L505 230" stroke="#cdd8e6" stroke-width="5"/>
    <text x="407" y="286" font-size="28" font-weight="900" font-style="italic" fill="#111827" transform="skewY(14) translate(0 -104)">777</text>
    <text x="410" y="300" font-size="11" font-weight="800" letter-spacing="1" fill="#1e88e5" transform="skewY(14) translate(0 -104)">SEVEN</text>

    <path d="M436 160 L500 147 L558 160 L494 175 Z" fill="url(#po-box-top)"/>
    <path d="M436 160 L494 175 L494 222 L436 207 Z" fill="#f4f7fb"/>
    <path d="M494 175 L558 160 L558 208 L494 222 Z" fill="#e3eaf3"/>
    <path d="M465 153 L529 167" stroke="#cdd8e6" stroke-width="4"/>
    <text x="448" y="221" font-size="20" font-weight="900" font-style="italic" fill="#111827" transform="skewY(14) translate(0 -114)">777</text>
  </g>

  <!-- What is still owed: an hourglass -->
  <g filter="url(#po-shadow)">
    <circle cx="540" cy="96" r="36" fill="url(#po-wait)"/>
    <path d="M526 76 H554 M526 116 H554" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M529 77 C529 92 551 92 551 96 C551 100 529 100 529 115 H551 C551 100 529 100 529 96 C529 92 551 92 551 77 Z"
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M533 110 L540 103 L547 110 Z" fill="#ffffff"/>
  </g>

  <!-- Sparks -->
  <path d="M110 120 L126 98" stroke="#5fa3fb" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 150 L128 140" stroke="#5fa3fb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="598" cy="176" r="6" fill="#fcd34d"/>
  <circle cx="104" cy="250" r="5" fill="#9cc7ff"/>
</svg>
